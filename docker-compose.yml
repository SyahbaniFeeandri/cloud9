services:
  # 1. MariaDB Database
  mariadb:
    image: mariadb:11
    container_name: fincloud-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: "GantiRootPass_123!"
      MARIADB_DATABASE: fincloud_db
      MARIADB_USER: webuser
      MARIADB_PASSWORD: "GantiWebPass_123!"
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    networks:
      - fincloud-network

  # 2. Backend REST API (Node.js Express + MariaDB)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fincloud-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USER: webuser
      DB_PASSWORD: "GantiWebPass_123!"
      DB_NAME: fincloud_db
      JWT_SECRET: "fincloud_super_secret_jwt_key_2026_cloud9"
      JWT_EXPIRES_IN: "7d"
    ports:
      - "5000:5000"
    depends_on:
      - mariadb
    networks:
      - fincloud-network

  # 3. Frontend Web Client (Nginx SPA)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fincloud-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - fincloud-network

volumes:
  mariadb_data:

networks:
  fincloud-network:
    driver: bridge

