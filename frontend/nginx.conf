server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # This container only serves the static SPA. All public routing
    # (/, /api/, /storage/) is handled by the central edge proxy in
    # infra/nginx/nginx.conf.

    # Never cache the entry HTML so new JS bundles are picked up.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # SPA fallback for hash routing / deep links.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
