global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    stack: fincloud

rule_files:
  - /etc/prometheus/alert.rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: fincloud-backend
    metrics_path: /metrics
    static_configs:
      - targets: ['backend:5000']
        labels:
          service: fincloud-backend
          environment: docker

  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: node-exporter
          environment: docker

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: cadvisor
          environment: docker
    # cAdvisor reports containers discovered through containerd by ID only.
    # Derive a friendly service label from the image so dashboards stay readable.
    metric_relabel_configs:
      - source_labels: [image]
        regex: 'docker\.io/library/cloud9-fincloudapp-(backend|frontend):.*'
        target_label: service
        replacement: '$1'
      - source_labels: [image]
        regex: '.*/(promtail|loki|grafana|prometheus|node-exporter|cadvisor):.*'
        target_label: service
        replacement: '$1'
      - source_labels: [image]
        regex: 'docker\.io/library/(nginx|mariadb):.*'
        target_label: service
        replacement: '$1'
      - source_labels: [image]
        regex: '.*minio:.*'
        target_label: service
        replacement: 'minio'
