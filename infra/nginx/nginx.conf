# =============================================================================
# FinCloud — Central Reverse Proxy (edge)
# =============================================================================
# Mounted at /etc/nginx/conf.d/default.conf by the `nginx` service.
#
# Public routing (single entry point):
#   /          -> frontend:80   (SPA static files)
#   /api/      -> backend:5000  (REST API)
#   /storage/  -> minio:9000    (private receipt objects)
#
# Both HTTP and HTTPS are served:
#   HTTP  : host ${NGINX_HTTP_PORT:-8080}  -> container :80
#   HTTPS : host ${NGINX_HTTPS_PORT:-8443} -> container :443
#
# The certificate is generated automatically by the `certs` service in
# docker-compose.yml (self-signed for local/demo use). Replace
# infra/nginx/certs/fincloud.crt and fincloud.key with a trusted certificate
# for a public deployment.
#
# The backend signs receipt URLs for /<bucket>/<key> and prepends the public
# path prefix (/storage). Nginx strips that prefix before proxying so the
# SigV4 canonical URI still matches. The Host header is forwarded unchanged
# because it is part of the signature.
# =============================================================================

upstream fincloud_frontend {
    server frontend:80;
}

upstream fincloud_backend {
    server backend:5000;
}

upstream fincloud_minio {
    server minio:9000;
}

# ---------------------------------------------------------------------------
# HTTP entry point
# ---------------------------------------------------------------------------
# Kept available for local tooling, healthchecks and backwards compatibility.
# Browser users may use HTTPS on the port published by NGINX_HTTPS_PORT.
server {
    listen 80;
    server_name _;

    include /etc/nginx/snippets/fincloud-locations.conf;
}

# ---------------------------------------------------------------------------
# HTTPS entry point
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fincloud.crt;
    ssl_certificate_key /etc/nginx/certs/fincloud.key;

    # Modern TLS only. TLS 1.3 ciphers are selected automatically.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;

    ssl_session_cache shared:FinCloudTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Self-signed certificates cannot be stapled. Re-enable when using a
    # trusted certificate chain in production.
    ssl_stapling off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    include /etc/nginx/snippets/fincloud-locations.conf;
}
