# =============================================================================
# FinCloud — shared edge routing
# =============================================================================
# Included by both the HTTP (port 80) and HTTPS (port 443) server blocks in
# nginx.conf. Keep transport-specific directives (TLS certificates, HSTS) in
# nginx.conf so the two entry points share exactly the same routing rules.
# =============================================================================

# Hide the nginx version in responses and proxied Server headers.
server_tokens off;
proxy_hide_header Server;

# Receipt uploads: backend limit is 10 MB.
client_max_body_size 12m;

# Baseline security headers for every response served through the edge.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-XSS-Protection "1; mode=block" always;

# Lightweight liveness probe (used by the container healthcheck).
location = /nginx-health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

# ---------------------------------------------------------------------- API
location = /api {
    return 308 /api/;
}

location /api/ {
    proxy_pass http://fincloud_backend;
    proxy_http_version 1.1;

    # Preserve the original Host (including port) for correct URLs.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
}

# ------------------------------------------------------------------ Storage
# Strip /storage/ so MinIO receives /<bucket>/<key>. This keeps the
# presigned SigV4 canonical URI valid while hiding MinIO behind the edge.
location = /storage {
    return 308 /storage/;
}

location /storage/ {
    proxy_pass http://fincloud_minio/;
    proxy_http_version 1.1;

    # The Host header is signed; forward it byte-for-byte.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Stream object downloads instead of buffering them in nginx.
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_connect_timeout 10s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

# The MinIO admin console is intentionally not exposed through the edge.
location /minio/ {
    return 404;
}

# ----------------------------------------------------------------- Frontend
location / {
    proxy_pass http://fincloud_frontend;
    proxy_http_version 1.1;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
}
